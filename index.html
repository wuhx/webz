<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WebArchive Mounter</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4a90e2"><link rel="stylesheet" href="app.css"></head><body><div id="upload-container" class="active"><div id="drop-zone"><p>Drag and drop an archive (.tar, .gz, .br, .zst, .zip) here</p><p>or</p><input type="file" id="file-input" accept=".tar,.tar.gz,.tgz,.tar.br,.tar.zstd,.tar.zst,.tar.zip,.zip,.br"><label for="file-input" class="button">Select File</label></div><div id="loading" class="hidden"><p>Mounting archive... <span id="progress"></span></p></div></div><iframe id="sandbox-frame" class="hidden" src="about:blank"></iframe><script type="module" src="bundle.js"></script></body></html>
