<!DOCTYPE html>
<html lang="en-US" data-singlehtml-polyglot="true">
<head>
<meta charset="UTF-8">
<title>SingleHtml Loading...</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fafafa; color: #374151; }
  .loader { text-align: center; }
  .spinner { border: 3px solid #f3f4f6; border-top: 3px solid #9ca3af; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .error { display: none; width: 100%; max-width: 680px; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); word-break: break-all; margin: 20px; box-sizing: border-box; }
  .drop-zone { border: 2px dashed #e5e7eb; border-radius: 12px; padding: 80px 40px; background: #fcfcfc; cursor: pointer; transition: all 0.3s ease; margin-top: 30px; }
  .drop-zone:hover { background: #f3f4f6; border-color: #d1d5db; }
  h3 { margin: 0; font-weight: 400; font-size: 18px; line-height: 1.8; color: #6b7280; }
  .drop-highlight { color: #111827; font-weight: 500; }
  .title-text { color: #9ca3af; font-size: 15px; margin: 0; }
</style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<div class="loader" id="loader">
  <div class="spinner" id="spinner"></div>
  <div id="status">Loading file...</div>
</div>
<div class="error" id="error"></div>
<iframe id="sandbox-frame" style="width:100%; height:100vh; border:none; display:none;"></iframe>

<script src="fzstd.min.js"></script>
<script>
  (() => {
    const id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[0-9A-Za-z]{8}$/.test(id)) return;

    window.singleHtmlBridgeId = id;
    const status = document.getElementById('status');
    status.textContent = '正在通过 SingleHtml 扩展打开离线文档…';
    setTimeout(() => {
      status.textContent = '未检测到 SingleHtml 扩展，请确认扩展已安装并启用。';
    }, 3000);
  })();
</script>
<script>
  if (!window.singleHtmlBridgeId) {
    const viewerScript = document.createElement('script');
    viewerScript.src = 'viewer_logic.js';
    document.body.appendChild(viewerScript);
  }
</script>

</body>
</html>
